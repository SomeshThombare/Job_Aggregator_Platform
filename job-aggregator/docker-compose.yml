services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_aggregator
      POSTGRES_USER: job_aggregator
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:

